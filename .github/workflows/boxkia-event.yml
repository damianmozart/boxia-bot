# Bot event Boxkia — dipicu tiap 5 menit (cron-job.org + cron GitHub sebagai cadangan).
# Tiap run bertahan sampai ACTIONS_BUDGET_MS (default 10 menit), jadi event yang
# jatuh di antara dua tick tetap ketangkep: run-nya tidur presisi sampai waktu tembak.
# Budget > jeda tick = nggak ada lagi event yang telat ke-join.
name: boxkia-event

on:
  # Pemicu utama: repository_dispatch dari cron eksternal (cron-job.org).
  repository_dispatch:
    types: [tick]
  # Cadangan kalau cron-job.org mati. Sengaja jarang (15 menit), bukan 5 menit:
  # satu run bisa nyala sampai 10 menit, jadi trigger yang terlalu rapat cuma
  # bikin run saling ngantre di concurrency group (GitHub pun membatalkan yang
  # ngantre) tanpa menambah peluang event ketangkep.
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: # tombol "Run workflow" buat tes manual

concurrency:
  group: boxkia-event
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # config.json asli (token akun + ntfy) diambil dari Secrets — jangan commit token!
      - name: Tulis config dari Secrets
        env:
          BOXKIA_CONFIG: ${{ secrets.BOXKIA_CONFIG }}
        run: echo "$BOXKIA_CONFIG" > config.json

      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: .cache
          key: boxkia-event-state-v1
          restore-keys: boxkia-event-state-v1

      - name: Jalankan bot (arm → tidur presisi → join)
        env:
          DATA_DIR: ${{ github.workspace }}/.cache
          ACTIONS_BUDGET_MS: '600000' # 10 menit — wajib > jeda tick cron (5 menit)
        run: node bot.mjs --actions

      - name: Bersihkan log (biar cache nggak gendut)
        run: rm -f .cache/*.log

      - name: Simpan state (key unik per run biar save selalu sukses)
        uses: actions/cache/save@v4
        with:
          path: .cache
          key: boxkia-event-state-v1-${{ github.run_id }}
