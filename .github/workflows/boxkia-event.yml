# Bot event Boxkia — jalan tiap 5 menit via cron.
# Kalau ada event mulai <= 6 menit lagi, job tidur sampai fast window,
# burst join, lapor hasil, lalu keluar. State persist lewat cache (.cache).
name: boxkia-event

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: # tombol "Run workflow" buat tes manual

concurrency:
  group: boxkia-event
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # config.json asli (token akun + ntfy) diambil dari Secrets — jangan commit token!
      - name: Tulis config dari Secrets
        env:
          BOXKIA_CONFIG: ${{ secrets.BOXKIA_CONFIG }}
        run: echo "$BOXKIA_CONFIG" > config.json

      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: .cache
          key: boxkia-state-v1

      - name: Jalankan bot (sleep-until-event)
        env:
          DATA_DIR: ${{ github.workspace }}/.cache
        run: node bot.mjs --actions

      - name: Bersihkan log (biar cache nggak gendut)
        run: rm -f .cache/*.log

      - name: Simpan state
        uses: actions/cache/save@v4
        with:
          path: .cache
          key: boxkia-state-v1
