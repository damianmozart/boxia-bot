# Daily Free Blind Box draw — khusus 3 akun (West said, Boxkia 27895, Femzy).
# Reset box itu 24 jam BERGULIR dari draw terakhir tiap akun (bukan jam 00:00
# global), jadi cron-nya jalan TIAP JAM. Script-nya sendiri cuma notif kalau
# ada yang benar-benar di-draw — run yang cuma ngecek itu diam.
name: boxkia-freebox

on:
  repository_dispatch:
    types: [freebox]
  schedule:
    - cron: '0 * * * *'    # tiap jam — nangkep semua jam reset akun
  workflow_dispatch:

concurrency:
  group: boxkia-freebox
  cancel-in-progress: false

jobs:
  draw:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Tulis config dari Secrets
        env:
          BOXKIA_CONFIG: ${{ secrets.BOXKIA_CONFIG }}
        run: echo "$BOXKIA_CONFIG" > config.json

      - name: Draw Free Blind Box
        run: node freebox-draw.mjs
