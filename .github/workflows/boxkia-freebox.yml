# Daily Free Blind Box draw — khusus 3 akun (West said, Boxkia 27895, Femzy).
# Reset box itu 24 jam BERGULIR dari draw terakhir tiap akun (bukan jam 00:00
# global), jadi pengecekannya harus sering.
#
# Pemicu utama: tick 5 menit dari cron-job.org (event_type 'tick'). Cron bawaan
# GitHub dipakai sebagai cadangan saja: cron tepat di menit :00 itu slot paling
# padat sedunia dan GitHub memang MENDIAMKAN run terjadwal saat antrean berat —
# kejadian nyata: 3 jam tanpa run sama sekali. Jadi cadangannya digeser ke menit
# sepi (menit 23).
#
# Aman dijalankan sesering apa pun: script-nya cuma DRAW kalau box-nya benar-benar
# siap (status 1) dan cuma kirim notif kalau ada yang menang atau ada error.
name: boxkia-freebox

on:
  repository_dispatch:
    types: [tick, freebox]
  schedule:
    - cron: '23 * * * *'   # cadangan — menit sepi, hindari antrean menit :00
  workflow_dispatch:

concurrency:
  group: boxkia-freebox
  cancel-in-progress: false

jobs:
  draw:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Tulis config dari Secrets
        env:
          BOXKIA_CONFIG: ${{ secrets.BOXKIA_CONFIG }}
        run: echo "$BOXKIA_CONFIG" > config.json

      - name: Draw Free Blind Box
        run: node freebox-draw.mjs
